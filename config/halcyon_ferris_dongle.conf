# Dongle-only Kconfig options.

# Debugging the touchpad drag lock: uncomment the three lines below, rebuild
# and flash the dongle; it then also enumerates a USB serial port. Read it
# with e.g. `nix shell nixpkgs#tio -c tio /dev/ttyACM0` and watch the
# "drag_lock:" lines while using the touchpad.
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_ZMK_LOGGING_MINIMAL=y
# CONFIG_ZMK_INPUT_PROCESSOR_DRAG_LOCK_TRACE=y
