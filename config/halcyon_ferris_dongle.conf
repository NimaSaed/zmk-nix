# Dongle-only Kconfig options.

# Touchpad event capacity on the central. The right half sends every Cirque
# packet as three separate BLE notifications (REL_X, REL_Y, BTN_TOUCH+sync)
# at up to 100 packets/s, i.e. up to 300 notifications/s. With the defaults
# the dongle could acknowledge only one or two packets per 7.5 ms connection
# event (BT_CTLR_RX_BUFFERS=1) and queued the result in a 5-entry queue
# that drops silently when full, then a 16-entry input queue. Torn
# X/Y/sync triplets show up as cursor jumps and wrong-direction frames.
CONFIG_BT_CTLR_RX_BUFFERS=6
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=64
# Larger than the queue above: the central drains that whole queue into this
# one in a single pass.
CONFIG_INPUT_QUEUE_MAX_MSGS=96

# Note: CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0 was tried for the ~250 ms gaps
# seen during continuous movement; it made no difference (the gaps are the
# pad losing the finger near its rim) and would cost both halves most of
# their idle battery life, so the ZMK default (30) is kept.

# USB logging (README "Getting logs"): the dongle enumerates a second USB
# serial port; capture with scripts/zmk-log.sh. ZMK itself is kept at ERROR
# level: ZMK_LOGGING_MINIMAL drops it from DEBUG (which would log every
# touchpad event) and ZMK_LOG_LEVEL_ERR silences the "Failed to untrack
# released key" warning ZMK's input split prints on every packet because the
# Cirque repeats the button state. The drag-lock module logs under its own
# "drag_lock" module at INFO: STATS prints one "drag_lock stats:" summary per
# 5 s of touchpad traffic, TRACE logs every press classification and state
# change. Comment this whole block out when done.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_ERR=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_ZMK_INPUT_PROCESSOR_DRAG_LOCK_STATS=y
CONFIG_ZMK_INPUT_PROCESSOR_DRAG_LOCK_TRACE=y
