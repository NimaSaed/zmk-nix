# Halcyon Ferris config (both halves).
# The splitkb module already enables sleep, RGB underglow (off on start,
# brightness capped) and a 600 s battery report interval.

# Pointing device support for the Cirque touchpad + mouse layer (&mmv/&msc/&mkp)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Deep sleep after 30 min idle (uncomment/adjust to taste)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Uncomment to boost BLE TX power if the connection is flaky
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
