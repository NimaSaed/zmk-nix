# Right half only (the half with the Cirque touchpad).

# Touchpad event capacity on the peripheral. Each Cirque packet becomes three
# BLE notifications (REL_X, REL_Y, BTN_TOUCH+sync), up to 300/s. With the
# default 3 ACL/L2CAP/ATT TX buffers only three notifications could be in
# flight per 7.5 ms connection event, and the 32-entry send queue dropped
# the oldest event when full, tearing packets apart (cursor jumps, frames
# moving in the wrong direction). See also halcyon_ferris_dongle.conf.
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_ATT_TX_COUNT=8
CONFIG_ZMK_INPUT_SPLIT_MSG_QUEUE_SIZE=128

# USB logging while the half is on a USB cable (README "Getting logs"):
# shows "Input event queue full" / "Error notifying input event" from the
# BLE send path and errors from the Cirque driver. Comment out when done.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
